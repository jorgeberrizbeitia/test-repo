
name: Set cohort course index

on:
  create:

permissions:
  contents: write

jobs:
  set-index:
    if: >-
      github.event.ref_type == 'branch' &&
      startsWith(github.event.ref, 'cohort-')

    runs-on: ubuntu-latest

    steps:
      - name: Check out the new cohort branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref }}

      - name: Select index based on cohort branch
        shell: bash
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          echo "Processing branch: $BRANCH"

          if [[ "$BRANCH" == *FT* ]]; then
            SOURCE="index-ft.yaml"
          elif [[ "$BRANCH" == *PT* ]]; then
            SOURCE="index-pt.yaml"
          else
            echo "ERROR: Branch name must contain FT or PT."
            exit 1
          fi

          if [[ ! -f "$SOURCE" ]]; then
            echo "ERROR: $SOURCE does not exist."
            exit 1
          fi

          cp "$SOURCE" index.yaml
          echo "Created index.yaml from $SOURCE"

      - name: Commit generated index.yaml
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: generate index.yaml for cohort"
          git push origin "HEAD:$TARGET_BRANCH"
